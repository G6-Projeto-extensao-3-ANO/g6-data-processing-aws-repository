AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Ubuntu para Processamento de Dados
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID da VPC onde a EC2 será criada

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: ID da subnet onde a EC2 será criada
  LabInstanceProfile:
    Type: String
    Description: Instance Profile associado a LabRole

  InstanceType:
    Type: String
    Default: t3.small # Talvez maior
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: EC2 Ubuntu - HTTP HTTPS JupyterLab e acesso via AWS Systems Manager

      VpcId:
        Ref: VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Acesso HTTP

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Acesso HTTPS

        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Acesso ao JupyterLab

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: sg-data-processing-ec2

  EC2Instance:
    Type: AWS::EC2::Instance

    Properties:
      ImageId:
        Ref: UbuntuAmi

      InstanceType:
        Ref: InstanceType

      SubnetId:
        Ref: SubnetId

      SecurityGroupIds:
        - Ref: EC2SecurityGroup

      IamInstanceProfile:
        Ref: LabInstanceProfile

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true

      Tags:
        - Key: Name
          Value: ec2-data-processing-ubuntu

      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          echo "Inicializando EC2..."
          apt-get update -y
          echo "Verificando AWS Systems Manager Agent..."
          systemctl enable amazon-ssm-agent || true
          systemctl start amazon-ssm-agent || true
          echo "Configuração inicial concluída."

Outputs:
  InstanceId:
    Description: ID da EC2
    Value:
      Ref: EC2Instance
    Export:
      Name: Data-Processing-InstanceId

  InstancePublicIp:
    Description: IP publico da EC2
    Value:
      Fn::GetAtt:
        - EC2Instance
        - PublicIp

  SecurityGroupId:
    Description: Security Group da EC2
    Value:
      Ref: EC2SecurityGroup